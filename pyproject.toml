[project]
name = "the-seed"
version = "0.1.0"
description = "LLM Agent framework"
requires-python = ">=3.10"
dependencies = [
    "flashtext>=2.7",
    "openai>=1.49.0",
    "rapidfuzz>=3.14.3",
    "websockets>=12.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"the_seed" = [
    "demos/openra/templates/commands/*.tmpl",
    "demos/openra/templates/commands/steps/*.tmpl",
    "demos/openra/templates/commands/wrappers/*.tmpl",
]

[tool.setuptools.packages.find]
where = ["."]
